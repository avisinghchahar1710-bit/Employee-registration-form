
<!DOCTYPE html>
<html>

<head>

    <title>Employee Registration Form</title>

</head>

<body>

    <h1>Employee Registration Form</h1>

    <form>

        <label>Employee Name:</label><br>
        <input type="text" value="Jon Snow">
        <br><br>

        <label>Email Address:</label><br>
        <input type="email" value="jon.snow@example.com">
        <br><br>

        <label>Password:</label><br>
        <input type="password" value="WinterIsComing123">
        <br><br>

        <label>Date of Joining:</label><br>
        <input type="date" value="2026-11-01">
        <br><br>

        <label>Department:</label><br>

        <select>
            <option>Finance</option>
            <option>Marketing</option>
            <option>Human Resources</option>
            <option>Information Technology</option>
            <option>Administration</option>
        </select>

        <br><br>

        <label>Gender:</label><br>

        <input type="radio" name="gender" checked>
        Male

        <input type="radio" name="gender">
        Female

        <input type="radio" name="gender">
        Other

        <br><br>

        <label>Skills:</label><br>

        <input type="checkbox" checked>
        MS Excel

        <input type="checkbox" checked>
        Accounting

        <input type="checkbox" checked>
        HTML

        <input type="checkbox">
        CSS

        <br><br>

        <label>Address:</label><br>

        <textarea rows="4" cols="35">Winterfell, The North, Westeros</textarea>

        <br><br>

        <input type="submit" value="Submit">

        <input type="reset" value="Reset">

    </form>

</body>

</html>
